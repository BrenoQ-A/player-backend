services:
  - type: web
    name: player-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STORAGE_DRIVER
        value: s3
      - key: GITHUB_TOKEN
        sync: false
      - key: PRIVATE_REPO
        sync: false
      - key: PRIVATE_BRANCH
        value: main
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: MAX_OUTPUT_MB
        value: "1000"
      - key: MAX_PROCESSING_QUEUE
        value: "4"
      - key: FFMPEG_PRESET
        value: ultrafast
      - key: FFMPEG_CRF
        value: "23"
      - key: FFMPEG_MAX_WIDTH
        value: "1280"
      - key: FFMPEG_MAX_HEIGHT
        value: "720"
      - key: FFMPEG_VIDEO_FPS
        value: "30"
      - key: IMAGE_VIDEO_FPS
        value: "15"
      - key: FFMPEG_MAXRATE
        value: 3M
      - key: FFMPEG_BUFSIZE
        value: 6M
      - key: FFMPEG_THREADS
        value: "1"
      - key: STORAGE_UPLOAD_CONCURRENCY
        value: "1"
      - key: STORAGE_UPLOAD_PART_MB
        value: "8"
      - key: YOUTUBE_AUDIO_MAX_MINUTES
        value: "60"
      - key: YOUTUBE_AUDIO_MAX_MB
        value: "100"
      - key: YOUTUBE_AUDIO_TIMEOUT_MS
        value: "180000"
      - key: YOUTUBE_JS_RUNTIME
        value: node
      - key: YOUTUBE_COOKIES_BASE64
        sync: false
