services:
  - type: web
    name: player-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: STORAGE_DRIVER
        value: s3
      - key: GITHUB_TOKEN
        sync: false
      - key: PRIVATE_REPO
        sync: false
      - key: PRIVATE_BRANCH
        value: main
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: MAX_OUTPUT_MB
        value: "1000"
