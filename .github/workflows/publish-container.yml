name: Publish backend container

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/publish-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/brenoq-a/player-backend:latest
            ghcr.io/brenoq-a/player-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy immutable image to Azure Container Apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name player-backend \
            --resource-group rg-player-sinalizacao \
            --image ghcr.io/brenoq-a/player-backend:${{ github.sha }}

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL='https://player-backend.ambitiouswave-c76e39f5.brazilsouth.azurecontainerapps.io/health'
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 15 "$HEALTH_URL" || true)"
            if [ "$status" = '200' ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check $attempt/12 retornou HTTP ${status:-erro}; aguardando nova revisão..."
            sleep 10
          done
          echo 'A nova revisão não ficou saudável dentro de 2 minutos.' >&2
          [ -f /tmp/health.json ] && cat /tmp/health.json >&2 || true
          exit 1
